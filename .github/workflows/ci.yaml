name: Java CI & Coverage Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          # Tell setup-java where the pom.xml is for caching
          cache-dependency-path: 'java-assignment/pom.xml'

      - name: Build and run coverage check
        # Execute Maven inside the java-assignment subfolder
        working-directory: ./java-assignment
        run: bash ./mvnw clean verify

      - name: Publish coverage summary
        if: always()
        working-directory: ./java-assignment
        shell: bash
        run: |
          echo "## Code Coverage" >> "$GITHUB_STEP_SUMMARY"

          if [ -f target/jacoco-report/jacoco.csv ]; then
            COVERAGE=$(awk -F',' '
              NR > 1 {
                      missed += $8
                     covered += $9
                     }
             END {
            total = missed + covered
            if (total > 0)
            printf "%.2f", (covered / total) * 100
           }
           ' target/jacoco-report/jacoco.csv)
          echo "**Line coverage: ${COVERAGE}%**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Detailed JaCoCo HTML report is available in the workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**JaCoCo report was not generated.**" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: java-assignment/target/jacoco-report/